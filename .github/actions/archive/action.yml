name: Sign and archive
description: Imports the signing certificate and archives the app into $RUNNER_TEMP/vibetype.xcarchive, see docs/signing.md

inputs:
  api-key-id:
    required: true
  api-key-issuer-id:
    required: true
  api-key-private-key:
    required: true
  build-certificate-base64:
    required: true
  keychain-password:
    required: true
  p12-password:
    required: true

runs:
  using: composite
  steps:
    # Without a signing identity in the keychain, automatic signing creates a new certificate on every run until the account hits Apple's limit.
    - name: Import signing certificate
      shell: bash
      env:
        BUILD_CERTIFICATE_BASE64: ${{ inputs.build-certificate-base64 }}
        KEYCHAIN_PASSWORD: ${{ inputs.keychain-password }}
        P12_PASSWORD: ${{ inputs.p12-password }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
        security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
        security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
        security list-keychain -d user -s "$keychain"
        security find-identity -v -p codesigning "$keychain" | grep "Apple Development"

    - name: Archive app
      shell: bash
      env:
        API_KEY_ID: ${{ inputs.api-key-id }}
        API_KEY_ISSUER_ID: ${{ inputs.api-key-issuer-id }}
        API_KEY_PRIVATE_KEY: ${{ inputs.api-key-private-key }}
      run: |
        mkdir -p "$RUNNER_TEMP/private_keys"
        echo "$API_KEY_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
        xcodebuild -project vibetype.xcodeproj \
          -scheme vibetype \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/vibetype.xcarchive" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
          -authenticationKeyID "$API_KEY_ID" \
          -authenticationKeyIssuerID "$API_KEY_ISSUER_ID" \
          archive
