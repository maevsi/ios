name: Signing

permissions: {}

on:
  push:
    branches:
      - docs/signing/environment
  workflow_dispatch:

jobs:
  signing:
    name: Sign and export without uploading
    runs-on: macos-26
    timeout-minutes: 30
    environment: testflight
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign and archive
        uses: ./.github/actions/archive
        with:
          api-key-id: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          api-key-issuer-id: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
          api-key-private-key: ${{ secrets.APPSTORE_CONNECT_API_KEY_PRIVATE_KEY }}
          build-certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      # Exporting locally still goes through cloud signing for distribution, so only the upload itself is left out.
      - name: Export without uploading
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ISSUER_ID }}
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace destination -string export "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/vibetype.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_KEY_ISSUER_ID"
