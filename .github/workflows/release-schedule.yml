name: "Release: Scheduled"

permissions: {}

on:
  schedule:
    - cron: "44 9 26 */2 *" # 26th of every other month at 09:44 AM UTC on the default branch
  workflow_dispatch:

jobs:
  release-schedule:
    name: "Release: Scheduled"
    uses: dargmuesli/github-actions/.github/workflows/release-schedule.yml@318a575af13dfd54dca497f6b190b0ac70ded4ed # 5.9.11
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      IS_DEBOUNCED: ${{ github.event_name != 'workflow_dispatch' }}