name: "Release: Scheduled"

permissions: {}

on:
  schedule:
    - cron: "44 9 26 */2 *" # 26th of every other month at 09:44 AM UTC on the default branch
  workflow_dispatch:

jobs:
  release-schedule:
    name: "Release: Scheduled"
    uses: dargmuesli/github-actions/.github/workflows/release-schedule.yml@ab8e226263168a9aab8c98d6db89ce707f77497e # 5.11.0
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      IS_DEBOUNCED: ${{ github.event_name != 'workflow_dispatch' }}