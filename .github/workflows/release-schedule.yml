name: "Release: Scheduled"

permissions: {}

on:
  schedule:
    - cron: "44 9 26 */2 *" # 26th of every other month at 09:44 AM UTC on the default branch
  workflow_dispatch:

jobs:
  release-schedule:
    name: "Release: Scheduled"
    uses: dargmuesli/github-actions/.github/workflows/release-schedule.yml@c5ce66f1d49540c35f76c4876e0eaa083bc27739 # 5.9.7
    permissions:
      contents: read
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
    with:
      IS_DEBOUNCED: ${{ github.event_name != 'workflow_dispatch' }}